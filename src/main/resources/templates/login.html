<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --deep:#0B3D91;
            --primary:#2F6FED;
            --sky:#6FB1FC;
            --navy:#0A1F44;
            --muted:#5A6B8C;
            --glass:rgba(255,255,255,.62);
            --glass-brd:rgba(255,255,255,.5);
        }
        *{box-sizing:border-box;}
        body{
            font-family:'Inter',sans-serif;
            color:var(--navy);
            margin:0;
            min-height:100vh;
            background:linear-gradient(160deg,#eaf3ff 0%,#dbe9ff 40%,#cfe1ff 100%);
            display:flex;
            align-items:center;
        }
        h1,h2,h3,h4,h5{font-family:'Poppins',sans-serif;}

        /* background blobs */
        .blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;opacity:.45;}
        .blob-1{width:460px;height:460px;background:radial-gradient(circle at 30% 30%,#7EB2FF,#2F6FED);top:-160px;left:-140px;animation:float1 18s ease-in-out infinite;}
        .blob-2{width:380px;height:380px;background:radial-gradient(circle at 60% 40%,#BFE0FF,#5C9CFF);bottom:-140px;right:-140px;animation:float2 22s ease-in-out infinite;}
        .blob-3{width:300px;height:300px;background:radial-gradient(circle at 50% 50%,#0B3D91,#2F6FED);top:55%;left:8%;opacity:.2;animation:float3 26s ease-in-out infinite;}
        @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,50px) scale(1.07);}}
        @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,30px) scale(1.05);}}
        @keyframes float3{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-30px);}}
        @media (prefers-reduced-motion: reduce){.blob{animation:none;}}

        .page-wrap{position:relative;z-index:1;width:100%;}
        .container{max-width:1140px;}

        /* glass card */
        .glass-card{

            background:var(--glass);
            backdrop-filter:blur(18px) saturate(160%);
            -webkit-backdrop-filter:blur(18px) saturate(160%);
            border:1px solid var(--glass-brd);
            border-radius:22px;
            box-shadow:0 25px 55px -30px rgba(11,61,145,.5);
            overflow:hidden;

            animation:fadeUp .8s ease;
        }

        @keyframes fadeUp{

            from{

                opacity:0;
                transform:translateY(35px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }

        .login-header{
            background:linear-gradient(135deg,var(--deep),var(--primary));
            color:#fff;
            text-align:center;
            padding:34px 24px 28px;
        }
        .login-header .brand-icon{
            width:56px;height:56px;border-radius:16px;
            background:rgba(255,255,255,.18);
            border:1px solid rgba(255,255,255,.35);
            display:flex;align-items:center;justify-content:center;
            font-size:1.5rem;
            margin:0 auto 14px;
        }
        .login-header h3{font-weight:700;font-size:1.4rem;margin-bottom:4px;}
        .login-header p{color:rgba(255,255,255,.85);font-size:.85rem;margin:0;}

        .login-body{padding:32px 30px;}

        .field-label{font-size:.82rem;font-weight:600;color:var(--navy);margin-bottom:6px;display:block;}
        .input-icon-wrap{position:relative;}
        .input-icon-wrap .bi{
            position:absolute;left:14px;top:50%;transform:translateY(-50%);
            color:var(--muted);font-size:.95rem;
        }
        .glass-input{
            background:rgba(255,255,255,.7);
            border:1px solid rgba(11,61,145,.14);
            border-radius:12px;
            padding:.65rem .9rem .65rem 2.5rem;
            font-size:.9rem;
            width:100%;
        }
        .glass-input:focus{
            background:#fff;
            border-color:var(--primary);
            box-shadow:0 0 0 .2rem rgba(47,111,237,.16);
            outline:none;
        }

        .btn-primary-glow{
            background:linear-gradient(135deg,var(--deep),var(--primary));
            border:none;color:#fff;font-weight:600;border-radius:12px;
            padding:.72rem 1rem;font-size:.92rem;
            box-shadow:0 14px 26px -12px rgba(47,111,237,.55);
            transition:transform .15s, box-shadow .15s;
        }
        .btn-primary-glow:hover{transform:translateY(-1px);box-shadow:0 18px 30px -12px rgba(47,111,237,.65);color:#fff;}

        .login-footer-note{
            text-align:center;
            color:var(--muted);
            font-size:.82rem;
            margin-top:22px;
        }
    </style>
</head>

<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page-wrap">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="glass-card">

                    <div class="login-header">
                        <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
                        <h3>Welcome Back 👋</h3>

                        <p>
                            Login to continue to
                            <strong>StudentHub</strong>
                        </p>
                    </div>


                    <div class="login-body">

                        <div th:if="${param.logout}"
                             class="alert alert-success">

                            <i class="bi bi-check-circle-fill me-2"></i>

                            You have been logged out successfully.

                        </div>

                        <div th:if="${param.error}"
                             class="alert alert-danger">

                            <i class="bi bi-exclamation-triangle-fill me-2"></i>

                            Invalid username or password.

                        </div>

                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">
                                <label class="field-label">Username</label>
                                <div class="input-icon-wrap">
                                    <i class="bi bi-person"></i>
                                    <input
                                            type="text"
                                            name="username"
                                            class="glass-input"
                                            placeholder="Enter your username"
                                            autocomplete="username"
                                            required>
                                </div>
                            </div>

                            <div class="mb-4">

                                <label class="field-label">Password</label>

                                <div class="input-icon-wrap">

                                    <i class="bi bi-lock"></i>

                                    <input
                                            type="password"
                                            id="password"
                                            name="password"
                                            class="glass-input"
                                            placeholder="Enter your password"
                                            autocomplete="current-password"
                                            required>

                                    <i class="bi bi-eye"
                                       id="togglePassword"
                                       style="
                position:absolute;
                right:15px;
                left:auto;
                cursor:pointer;
                color:#5A6B8C;
           ">
                                    </i>

                                </div>

                            </div>


                            <button
                                    type="submit"
                                    class="btn btn-primary-glow w-100">

                                <i class="bi bi-box-arrow-in-right me-2"></i>

                                Sign In

                            </button>

                        </form>

                        <p class="login-footer-note">

                            <strong>StudentHub v1.0</strong>

                            <br>

                            Built with ❤️ using

                            <br>

                            Java • Spring Boot • Spring Security • Hibernate

                            <br>

                            Thymeleaf • Bootstrap • MySQL

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>
<script>

    const toggle=document.getElementById("togglePassword");

    const password=document.getElementById("password");

    toggle.addEventListener("click",()=>{

        if(password.type==="password"){

            password.type="text";

            toggle.classList.remove("bi-eye");

            toggle.classList.add("bi-eye-slash");

        }

        else{

            password.type="password";

            toggle.classList.remove("bi-eye-slash");

            toggle.classList.add("bi-eye");

        }

    });

</script>

</body>
</html>
