<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --deep:#0B3D91;
            --primary:#2F6FED;
            --sky:#6FB1FC;
            --navy:#0A1F44;
            --muted:#5A6B8C;
            --success:#2FBF71;
            --warning:#F5A623;
            --warning-deep:#C97A0A;
            --danger:#E6484D;
            --info:#3EA6D8;
            --info-deep:#1E7FA8;
            --glass:rgba(255,255,255,.62);
            --glass-strong:rgba(255,255,255,.78);
            --glass-brd:rgba(255,255,255,.5);
        }
        *{box-sizing:border-box;}
        body{
            font-family:'Inter',sans-serif;
            color:var(--navy);
            margin:0;
            min-height:100vh;
            background:linear-gradient(160deg,#eaf3ff 0%,#dbe9ff 40%,#cfe1ff 100%);
        }
        h1,h2,h3,h4,h5{font-family:'Poppins',sans-serif;}

        /* background blobs */
        .blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;opacity:.45;}
        .blob-1{width:460px;height:460px;background:radial-gradient(circle at 30% 30%,#7EB2FF,#2F6FED);top:-160px;left:-140px;animation:float1 18s ease-in-out infinite;}
        .blob-2{width:380px;height:380px;background:radial-gradient(circle at 60% 40%,#BFE0FF,#5C9CFF);bottom:-140px;right:-140px;animation:float2 22s ease-in-out infinite;}
        .blob-3{width:300px;height:300px;background:radial-gradient(circle at 50% 50%,#0B3D91,#2F6FED);top:55%;left:8%;opacity:.2;animation:float3 26s ease-in-out infinite;}
        @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,50px) scale(1.07);}}
        @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,30px) scale(1.05);}}
        @keyframes float3{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-30px);}}
        @media (prefers-reduced-motion: reduce){.blob{animation:none;}}

        .page-wrap{position:relative;z-index:1;}

        /* navbar */
        .navbar-glass{
            background:var(--glass-strong);
            backdrop-filter:blur(18px) saturate(160%);
            -webkit-backdrop-filter:blur(18px) saturate(160%);
            border-bottom:1px solid var(--glass-brd);
            box-shadow:0 8px 24px -18px rgba(11,61,145,.4);
        }
        .brand-mark{
            display:flex;align-items:center;gap:10px;
            font-family:'Poppins',sans-serif;font-weight:700;font-size:1.15rem;color:var(--navy)!important;
        }
        .brand-mark .bi{
            background:linear-gradient(135deg,var(--deep),var(--primary));
            color:#fff;width:34px;height:34px;border-radius:10px;
            display:flex;align-items:center;justify-content:center;font-size:1rem;
        }

        .container{max-width:1140px;}

        /* glass card */
        .glass-card{
            background:var(--glass);
            backdrop-filter:blur(18px) saturate(160%);
            -webkit-backdrop-filter:blur(18px) saturate(160%);
            border:1px solid var(--glass-brd);
            border-radius:22px;
            box-shadow:0 25px 55px -30px rgba(11,61,145,.5);
            overflow:hidden;
        }

        .detail-header{
            background:linear-gradient(135deg,var(--info-deep),var(--info));
            color:#fff;
            padding:26px 30px;
            display:flex;
            align-items:center;
            gap:14px;
        }
        .detail-header .icon-chip{
            width:48px;height:48px;border-radius:14px;
            background:rgba(255,255,255,.22);
            border:1px solid rgba(255,255,255,.35);
            display:flex;align-items:center;justify-content:center;
            font-size:1.3rem;flex-shrink:0;
        }
        .detail-header h3{font-weight:700;font-size:1.3rem;margin-bottom:2px;}
        .detail-header p{color:rgba(255,255,255,.9);font-size:.83rem;margin:0;}

        .detail-body{padding:30px;}

        .detail-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:14px 18px;
            border-radius:13px;
            background:rgba(255,255,255,.55);
            border:1px solid rgba(11,61,145,.08);
            margin-bottom:10px;
        }
        .detail-row .label{
            display:flex;align-items:center;gap:10px;
            font-size:.82rem;font-weight:700;
            color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
        }
        .detail-row .label .bi{
            width:30px;height:30px;border-radius:9px;
            background:rgba(47,111,237,.1);
            color:var(--primary);
            display:flex;align-items:center;justify-content:center;
            font-size:.9rem;
        }
        .detail-row .value{
            font-size:.95rem;font-weight:600;color:var(--navy);
        }

        .badge-status{padding:.35rem .8rem;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.03em;}
        .badge-pass{background:rgba(47,191,113,.14);color:var(--success);}
        .badge-fail{background:rgba(230,72,77,.13);color:var(--danger);}

        .btn-edit-glow{
            background:linear-gradient(135deg,var(--warning-deep),var(--warning));
            border:none;color:#fff;font-weight:600;border-radius:12px;
            padding:.65rem 1.3rem;font-size:.88rem;
            box-shadow:0 14px 26px -12px rgba(245,166,35,.5);
            transition:transform .15s, box-shadow .15s;
            text-decoration:none;
            display:inline-flex;align-items:center;
        }
        .btn-edit-glow:hover{transform:translateY(-1px);box-shadow:0 18px 30px -12px rgba(245,166,35,.6);color:#fff;}

        .btn-back{
            background:rgba(11,61,145,.08);
            border:1px solid rgba(11,61,145,.14);
            color:var(--navy);
            font-weight:600;
            border-radius:12px;
            padding:.65rem 1.3rem;
            font-size:.88rem;
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            transition:background .15s;
        }
        .btn-back:hover{background:rgba(11,61,145,.14);color:var(--navy);}
    </style>
</head>

<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page-wrap">

    <nav class="navbar navbar-expand-lg navbar-glass py-3">
        <div class="container">
            <a class="navbar-brand brand-mark" href="/">
                <span class="bi bi-mortarboard-fill"></span> StudentHub
            </a>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="glass-card mx-auto" style="max-width:700px;">

            <div class="detail-header">
                <div class="icon-chip"><i class="bi bi-person-badge-fill"></i></div>
                <div>
                    <h3>Student Details</h3>
                    <p>Full profile and academic record</p>
                </div>
            </div>

            <div class="detail-body">

                <div class="detail-row">
                    <div class="label"><i class="bi bi-hash"></i> ID</div>
                    <div class="value" th:text="${student.id}"></div>
                </div>

                <div class="detail-row">
                    <div class="label"><i class="bi bi-person"></i> Name</div>
                    <div class="value" th:text="${student.name}"></div>
                </div>

                <div class="detail-row">
                    <div class="label"><i class="bi bi-envelope"></i> Email</div>
                    <div class="value" th:text="${student.email}"></div>
                </div>

                <div class="detail-row">
                    <div class="label"><i class="bi bi-calendar3"></i> Age</div>
                    <div class="value" th:text="${student.age}"></div>
                </div>

                <div class="detail-row">
                    <div class="label"><i class="bi bi-bar-chart"></i> Marks</div>
                    <div class="value" th:text="${student.marks}"></div>
                </div>

                <div class="detail-row">
                    <div class="label"><i class="bi bi-flag"></i> Status</div>
                    <div class="value">

                        <span th:if="${student.marks >= 35}"
                              class="badge-status badge-pass">
                            PASS
                        </span>

                        <span th:if="${student.marks < 35}"
                              class="badge-status badge-fail">
                            FAIL
                        </span>

                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">

                    <a th:href="@{/editStudent/{id}(id=${student.id})}"
                       class="btn-edit-glow">
                        <i class="bi bi-pencil me-1"></i> Edit
                    </a>

                    <a href="/students"
                       class="btn-back">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
