<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --deep:#0B3D91;
            --primary:#2F6FED;
            --navy:#0A1F44;
            --muted:#5A6B8C;
            --danger:#E6484D;
            --danger-deep:#B93338;
            --glass:rgba(255,255,255,.62);
            --glass-brd:rgba(255,255,255,.5);
        }
        *{box-sizing:border-box;}
        body{
            font-family:'Inter',sans-serif;
            color:var(--navy);
            margin:0;
            min-height:100vh;
            background:linear-gradient(160deg,#fdeeee 0%,#eaf3ff 45%,#dbe9ff 100%);
            display:flex;
            align-items:center;
        }
        h1,h2,h3,h4,h5{font-family:'Poppins',sans-serif;}

        /* background blobs */
        .blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;opacity:.4;}
        .blob-1{width:440px;height:440px;background:radial-gradient(circle at 30% 30%,#FF9B9E,#E6484D);top:-150px;left:-130px;animation:float1 18s ease-in-out infinite;}
        .blob-2{width:380px;height:380px;background:radial-gradient(circle at 60% 40%,#BFE0FF,#5C9CFF);bottom:-140px;right:-140px;animation:float2 22s ease-in-out infinite;}
        .blob-3{width:280px;height:280px;background:radial-gradient(circle at 50% 50%,#0B3D91,#2F6FED);top:55%;left:6%;opacity:.18;animation:float3 26s ease-in-out infinite;}
        @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,50px) scale(1.07);}}
        @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,30px) scale(1.05);}}
        @keyframes float3{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-30px);}}
        @media (prefers-reduced-motion: reduce){.blob{animation:none;}}

        .page-wrap{position:relative;z-index:1;width:100%;}
        .container{max-width:1140px;}

        /* glass card */
        .glass-card{
            background:var(--glass);
            backdrop-filter:blur(18px) saturate(160%);
            -webkit-backdrop-filter:blur(18px) saturate(160%);
            border:1px solid var(--glass-brd);
            border-radius:22px;
            box-shadow:0 25px 55px -30px rgba(11,61,145,.5);
            overflow:hidden;
            text-align:center;

            animation:fadeUp .8s ease;
        }

        @keyframes fadeUp{

            from{
                opacity:0;
                transform:translateY(35px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .error-header{
            background:linear-gradient(135deg,var(--danger-deep),var(--danger));
            color:#fff;
            padding:34px 24px 28px;
        }
        .error-header .icon-chip{
            width:60px;height:60px;border-radius:16px;
            background:rgba(255,255,255,.2);
            border:1px solid rgba(255,255,255,.35);
            display:flex;align-items:center;justify-content:center;
            font-size:1.6rem;
            margin:0 auto 14px;
        }
        .error-header h2{font-weight:700;font-size:1.5rem;margin:0;}

        .error-body{padding:34px 30px;}
        .error-message{
            color:var(--danger);
            font-weight:700;
            font-size:1.15rem;
        }
        .error-note{color:var(--muted);font-size:.9rem;margin-top:12px;}

        .btn-home-glow{
            background:linear-gradient(135deg,var(--deep),var(--primary));
            border:none;color:#fff;font-weight:600;border-radius:12px;
            padding:.7rem 1.5rem;font-size:.9rem;
            box-shadow:0 14px 26px -12px rgba(47,111,237,.55);
            transition:transform .15s, box-shadow .15s;
            display:inline-flex;align-items:center;
            text-decoration:none;
            margin-top:22px;
        }
        .btn-home-glow:hover{transform:translateY(-1px);box-shadow:0 18px 30px -12px rgba(47,111,237,.65);color:#fff;}
    </style>
</head>

<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page-wrap">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="glass-card">

                    <div class="error-header">
                        <div class="icon-chip"><i class="bi bi-exclamation-triangle-fill"></i></div>
                        Something Went Wrong
                    </div>

                    <div class="error-body">

                        <h4 class="error-message"
                            th:text="${message}">
                        </h4>

                        <p class="error-note">The page or operation you requested is currently unavailable.
                            Please return to the dashboard and try again.The requested operation could not be completed.
                        </p>

                        <a href="/" class="btn-home-glow">
                            <i class="bi bi-house-door-fill me-2"></i> Back to Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
