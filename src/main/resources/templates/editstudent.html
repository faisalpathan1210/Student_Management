<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root{
            --deep:#0B3D91;
            --primary:#2F6FED;
            --sky:#6FB1FC;
            --navy:#0A1F44;
            --muted:#5A6B8C;
            --warning:#F5A623;
            --warning-deep:#C97A0A;
            --danger:#E6484D;
            --glass:rgba(255,255,255,.62);
            --glass-brd:rgba(255,255,255,.5);
        }
        *{box-sizing:border-box;}
        body{
            font-family:'Inter',sans-serif;
            color:var(--navy);
            margin:0;
            min-height:100vh;
            background:linear-gradient(160deg,#eaf3ff 0%,#dbe9ff 40%,#cfe1ff 100%);
        }
        h1,h2,h3,h4,h5{font-family:'Poppins',sans-serif;}

        /* background blobs */
        .blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;opacity:.45;}
        .blob-1{width:460px;height:460px;background:radial-gradient(circle at 30% 30%,#7EB2FF,#2F6FED);top:-160px;left:-140px;animation:float1 18s ease-in-out infinite;}
        .blob-2{width:380px;height:380px;background:radial-gradient(circle at 60% 40%,#BFE0FF,#5C9CFF);bottom:-140px;right:-140px;animation:float2 22s ease-in-out infinite;}
        .blob-3{width:300px;height:300px;background:radial-gradient(circle at 50% 50%,#0B3D91,#2F6FED);top:55%;left:8%;opacity:.2;animation:float3 26s ease-in-out infinite;}
        @keyframes float1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,50px) scale(1.07);}}
        @keyframes float2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-40px,30px) scale(1.05);}}
        @keyframes float3{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,-30px);}}
        @media (prefers-reduced-motion: reduce){.blob{animation:none;}}

        .page-wrap{position:relative;z-index:1;}
        .container{max-width:1140px;}

        /* glass card */
        .glass-card{
            background:var(--glass);
            backdrop-filter:blur(18px) saturate(160%);
            -webkit-backdrop-filter:blur(18px) saturate(160%);
            border:1px solid var(--glass-brd);
            border-radius:22px;
            box-shadow:0 25px 55px -30px rgba(11,61,145,.5);
            overflow:hidden;
        }

        .form-header{
            background:linear-gradient(135deg,var(--warning-deep),var(--warning));
            color:#fff;
            padding:26px 30px;
            display:flex;
            align-items:center;
            gap:14px;
        }
        .form-header .icon-chip{
            width:48px;height:48px;border-radius:14px;
            background:rgba(255,255,255,.22);
            border:1px solid rgba(255,255,255,.35);
            display:flex;align-items:center;justify-content:center;
            font-size:1.25rem;flex-shrink:0;
        }
        .form-header h3{font-weight:700;font-size:1.3rem;margin-bottom:2px;}
        .form-header p{color:rgba(255,255,255,.9);font-size:.83rem;margin:0;}

        .form-body{padding:30px;}

        .field-label{font-size:.82rem;font-weight:600;color:var(--navy);margin-bottom:6px;display:block;}
        .input-icon-wrap{position:relative;}
        .input-icon-wrap .bi{
            position:absolute;left:14px;top:50%;transform:translateY(-50%);
            color:var(--muted);font-size:.95rem;
        }
        .glass-input{
            background:rgba(255,255,255,.7);
            border:1px solid rgba(11,61,145,.14);
            border-radius:12px;
            padding:.65rem .9rem .65rem 2.5rem;
            font-size:.9rem;
            width:100%;
        }
        .glass-input:focus{
            background:#fff;
            border-color:var(--warning);
            box-shadow:0 0 0 .2rem rgba(245,166,35,.18);
            outline:none;
        }
        .field-error{
            color:var(--danger);
            font-size:.78rem;
            font-weight:500;
            margin-top:6px;
        }

        .btn-warning-glow{
            background:linear-gradient(135deg,var(--warning-deep),var(--warning));
            border:none;color:#fff;font-weight:600;border-radius:12px;
            padding:.7rem 1.4rem;font-size:.9rem;
            box-shadow:0 14px 26px -12px rgba(245,166,35,.5);
            transition:transform .15s, box-shadow .15s;
        }
        .btn-warning-glow:hover{transform:translateY(-1px);box-shadow:0 18px 30px -12px rgba(245,166,35,.6);color:#fff;}

        .btn-cancel{
            background:rgba(11,61,145,.08);
            border:1px solid rgba(11,61,145,.14);
            color:var(--navy);
            font-weight:600;
            border-radius:12px;
            padding:.7rem 1.4rem;
            font-size:.9rem;
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            transition:background .15s;
        }
        .btn-cancel:hover{background:rgba(11,61,145,.14);color:var(--navy);}
    </style>
</head>

<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page-wrap">
    <div class="container mt-5">

        <div class="glass-card mx-auto" style="max-width:560px;">

            <div class="form-header">
                <div class="icon-chip"><i class="bi bi-pencil-fill"></i></div>
                <div>
                    <h3>Edit Student</h3>
                    <p>Update the student's details below</p>
                </div>
            </div>

            <div class="form-body">

                <form th:action="@{/updateStudent}"
                      th:object="${student}"
                      method="post">

                    <!-- Hidden ID -->
                    <input type="hidden" th:field="*{id}">

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="field-label">Name</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-person"></i>
                            <input type="text"
                                   class="glass-input"
                                   placeholder="Enter full name"
                                   th:field="*{name}" required>
                        </div>
                        <div class="field-error"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="field-label">Email</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-envelope"></i>
                            <input type="email"
                                   class="glass-input"
                                   placeholder="student@school.edu"
                                   th:field="*{email}" required>
                        </div>
                        <div class="field-error"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>
                    </div>

                    <!-- Age -->
                    <div class="mb-3">
                        <label class="field-label">Age</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-calendar3"></i>
                            <input type="number"
                                   class="glass-input"
                                   placeholder="Enter age"
                                   th:field="*{age}" required>
                        </div>
                        <div class="field-error"
                             th:if="${#fields.hasErrors('age')}"
                             th:errors="*{age}">
                        </div>
                    </div>

                    <!-- Marks -->
                    <div class="mb-4">
                        <label class="field-label">Marks</label>
                        <div class="input-icon-wrap">
                            <i class="bi bi-bar-chart"></i>
                            <input type="number"
                                   class="glass-input"
                                   placeholder="Enter marks"
                                   th:field="*{marks}" required>
                        </div>
                        <div class="field-error"
                             th:if="${#fields.hasErrors('marks')}"
                             th:errors="*{marks}">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning-glow">
                            <i class="bi bi-check2 me-1"></i> Update Student
                        </button>

                        <a href="/students" class="btn-cancel">
                            <i class="bi bi-x-lg me-1"></i> Cancel
                        </a>
                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

</body>
</html>
